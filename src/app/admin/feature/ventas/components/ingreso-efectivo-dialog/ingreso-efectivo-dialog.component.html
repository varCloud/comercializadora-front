<h2 mat-dialog-title>{{ 'ventas.caja.ingreso.title' | translate }}</h2>

<mat-dialog-content class="b-t-1" *blockUI="'ingresoEfectivoDialog'">
  <form [formGroup]="ingresoForm">
    <mat-form-field appearance="outline" class="w-100">
      <span matPrefix>$&nbsp;</span>
      <input matInput type="number" min="0.01" step="0.01" formControlName="monto" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-flat-button color="primary" type="button" [disabled]="guardando()" (click)="guardar()">
    {{ 'ventas.caja.ingreso.guardar' | translate }}
  </button>
</mat-dialog-actions>
