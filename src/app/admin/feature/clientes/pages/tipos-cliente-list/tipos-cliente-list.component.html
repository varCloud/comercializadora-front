<mat-card class="cardWithShadow">
  <mat-card-content class="p-24">
    <div class="row justify-content-between">
      <div class="col-lg-4">
        <mat-form-field appearance="outline" class="w-100 hide-hint">
          <input
            matInput
            [placeholder]="'tiposCliente.searchPlaceholder' | translate"
            (keyup)="applyFilter($any($event.target).value)"
          />
          <mat-icon matSuffix>
            <i-tabler name="search" class="icon-20"></i-tabler>
          </mat-icon>
        </mat-form-field>
      </div>
      <div class="col-lg-4 d-flex align-items-center justify-content-end">
        <button mat-flat-button color="primary" (click)="agregar()">
          {{ 'tiposCliente.add' | translate }}
        </button>
      </div>
    </div>
  </mat-card-content>
</mat-card>

<mat-card class="cardWithShadow" *blockUI="'tipos-cliente'">
  <mat-card-content class="p-24">
    <div class="table-responsive">
      <table mat-table [dataSource]="pag.data()" matSort (matSortChange)="onSort($event)" class="w-100 table-stacked-mobile">
        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="descripcion" class="f-s-16 f-w-600">{{ 'tiposCliente.columns.descripcion' | translate }}</th>
          <td mat-cell *matCellDef="let t" class="f-s-14" [attr.data-label]="'tiposCliente.columns.descripcion' | translate">{{ t.descripcion }}</td>
        </ng-container>

        <ng-container matColumnDef="descuento">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="descuento" class="f-s-16 f-w-600 text-right">{{ 'tiposCliente.columns.descuento' | translate }}</th>
          <td mat-cell *matCellDef="let t" class="f-s-14 text-right" [attr.data-label]="'tiposCliente.columns.descuento' | translate">{{ t.descuento | number:'1.0-2' }}%</td>
        </ng-container>

        <ng-container matColumnDef="action" stickyEnd>
          <th mat-header-cell *matHeaderCellDef class="f-s-16 f-w-600 text-right">{{ 'tiposCliente.columns.acciones' | translate }}</th>
          <td mat-cell *matCellDef="let t" class="action-link text-right" [attr.data-label]="'tiposCliente.columns.acciones' | translate">
            <a (click)="ver(t)" class="m-r-10 cursor-pointer" [style.color]="'#2e7d32'" [matTooltip]="'tiposCliente.actions.ver' | translate">
              <i-tabler name="eye" class="icon-18"></i-tabler>
            </a>
            <a (click)="editar(t)" class="m-r-10 cursor-pointer" [style.color]="'#1e88e5'" [matTooltip]="'tiposCliente.actions.editar' | translate">
              <i-tabler name="edit" class="icon-18"></i-tabler>
            </a>
            <a (click)="eliminar(t)" class="m-r-10 cursor-pointer" [style.color]="'#e53935'" [matTooltip]="'tiposCliente.actions.eliminar' | translate">
              <i-tabler name="trash" class="icon-18"></i-tabler>
            </a>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    @if (pag.isEmpty()) {
      <p class="text-center m-t-16">{{ 'tiposCliente.empty' | translate }}</p>
    }

    <app-paginador
      [paginador]="pag"
      (navegar)="navegar($event)"
      (perPageChange)="onPerPage($event)"
    ></app-paginador>
  </mat-card-content>
</mat-card>
