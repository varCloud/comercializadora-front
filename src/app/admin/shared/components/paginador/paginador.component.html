@if (paginador().meta(); as meta) {
  <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 m-t-16">
    <!-- Selector de tamaño de página -->
    <div class="d-flex align-items-center gap-2">
      <span class="mat-body-2 text-muted">{{ 'paginador.porPagina' | translate }}</span>
      <mat-form-field appearance="outline" class="hide-hint" style="width: 90px">
        <mat-select [value]="meta.perPage" (selectionChange)="onPerPage($event.value)">
          @for (size of pageSizeOptions(); track size) {
            <mat-option [value]="size">{{ size }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Rango actual -->
    <span class="mat-body-2 text-muted">
      {{ 'paginador.rango' | translate: { from: meta.from ?? 0, to: meta.to ?? 0, total: meta.total } }}
    </span>

    <!-- Navegación por links -->
    <div class="d-flex align-items-center gap-1">
      <button mat-icon-button [disabled]="!paginador().hasPrev()" (click)="irA('first')" [matTooltip]="'paginador.primera' | translate">
        <i-tabler name="chevrons-left" class="icon-18"></i-tabler>
      </button>
      <button mat-icon-button [disabled]="!paginador().hasPrev()" (click)="irA('prev')" [matTooltip]="'paginador.anterior' | translate">
        <i-tabler name="chevron-left" class="icon-18"></i-tabler>
      </button>
      <span class="mat-body-2 p-x-8">{{ meta.currentPage }} / {{ meta.lastPage }}</span>
      <button mat-icon-button [disabled]="!paginador().hasNext()" (click)="irA('next')" [matTooltip]="'paginador.siguiente' | translate">
        <i-tabler name="chevron-right" class="icon-18"></i-tabler>
      </button>
      <button mat-icon-button [disabled]="!paginador().hasNext()" (click)="irA('last')" [matTooltip]="'paginador.ultima' | translate">
        <i-tabler name="chevrons-right" class="icon-18"></i-tabler>
      </button>
    </div>
  </div>
}
